name: Report an error in the book
description: A mistake in the text, a figure, a table, a listing or a printed output of either volume.
title: "Erratum: "
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report it. Every report is read.
  - type: dropdown
    id: volume
    attributes:
      label: Volume
      options:
        - "Volume I: Models, Learning, and Decisions, from First Principles"
        - "Volume II: Agents, Operations, and Governance, in Production"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Hardcover
        - Paperback
        - Kindle
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The chapter and the page, or the Kindle location, and the figure, table or listing if there is one.
      placeholder: "Chapter 25, page 212, Figure 25.2"
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What the book says
      description: Quote the passage, or describe the figure or output.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say, and why
      description: A source, a calculation or a run of the code helps.
    validations:
      required: true
