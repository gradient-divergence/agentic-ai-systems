name: A problem with the code
description: A demo, an exercise, a test or the refund agent fails, or prints something other than the book.
title: "Code: "
labels: ["code"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter and script
      placeholder: "Chapter 31, python -m demos.batch_stream_demo"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact commands, from a fresh clone if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: The error or the output that differs, and the stored output or page it differs from.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and uv or pip.
      placeholder: "macOS 15, Python 3.12, uv 0.9"
    validations:
      required: true
